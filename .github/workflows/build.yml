name: Build

on:
  push:
    branches: [ "main", "arena/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.1.1"

      - name: Regenerate assets and data
        run: |
          python3 tools/generate_textures.py
          python3 tools/generate_models.py
          python3 tools/generate_lang.py
          python3 tools/generate_data.py

      - name: Static consistency checks
        run: |
          python3 tools/check_java.py
          python3 tools/check_refs.py
          python3 tools/check_chronicle.py
          python3 tools/check_lang.py
          python3 tools/check_api.py

      - name: Build with Loom
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: aetherius-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Attach jar to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true

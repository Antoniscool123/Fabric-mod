name: Build

on:
  push:
    branches: [ "main", "arena/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Regenerate assets and data
        run: |
          python3 tools/generate_textures.py
          python3 tools/generate_models.py
          python3 tools/generate_lang.py
          python3 tools/generate_data.py

      - name: Static consistency checks
        run: |
          python3 tools/check_java.py
          python3 tools/check_refs.py
          python3 tools/check_chronicle.py
          python3 tools/check_lang.py
          python3 tools/check_api.py

      - name: Probe API symbols
        run: gradle probeApi --no-daemon --console=plain > probe.txt 2>&1 || true
        continue-on-error: true

      - name: Compile (diagnostic pass)
        run: |
          set +e
          gradle compileJava --no-daemon --console=plain --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "GRADLE_EXIT=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Dump API symbol locations
        if: always()
        run: |
          JAR=$(find ~/.gradle/caches/fabric-loom -name "*mapped*.jar" 2>/dev/null | head -1)
          echo "mapped jar: $JAR" > symbols.txt
          if [ -n "$JAR" ]; then
            for n in Mth RegistryEntry DamageTypeTags EntityModel PersistentState SpriteProvider PlayerLookup Enchantments ExplosionSourceType RegistryEntryList ItemCooldownManager BlockEntityType; do
              echo "== $n" >> symbols.txt
              unzip -l "$JAR" | grep -E "(^|/)$n(\\$[A-Za-z]+)?\\.class" | awk '{print $4}' | head -6 >> symbols.txt
            done
            echo "== PersistentState members" >> symbols.txt
            javap -classpath "$JAR" net.minecraft.world.PersistentState 2>&1 | head -25 >> symbols.txt
            echo "== EntityModel check" >> symbols.txt
            javap -classpath "$JAR" net.minecraft.client.model.EntityModel 2>&1 | head -5 >> symbols.txt
            javap -classpath "$JAR" net.minecraft.client.model.Model 2>&1 | head -8 >> symbols.txt
          fi
          cat symbols.txt

      - name: Report compile errors
        if: env.GRADLE_EXIT != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch (e) { log = 'no build.log'; }
            const lines = log.split(/\r?\n/);
            const out = [];
            for (let i = 0; i < lines.length; i++) {
              if (/\.java:\d+: (error|warning):/.test(lines[i]) || /^error:/.test(lines[i])) {
                out.push(...lines.slice(i, Math.min(lines.length, i + 6)));
                i += 5;
              } else if (/FAILURE:|What went wrong|Execution failed|Caused by:/.test(lines[i])) {
                out.push(lines[i]);
              }
            }
            let sym = '';
            for (const f of ['probe.txt', 'symbols.txt']) {
              try { sym += fs.readFileSync(f, 'utf8'); } catch (e) { sym += f + ': missing\n'; }
            }
            let body = `### CI compile report\n\nGradle exit code: \`${{ env.GRADLE_EXIT }}\`\n\n`
                     + '```\n' + (out.length ? out.join('\n') : log.slice(-4000)) + '\n```';
            body += '\n\n### API symbol locations\n\n```\n' + sym.slice(0, 12000) + '\n```';
            if (body.length > 60000) body = body.slice(0, 60000) + '\n...truncated';
            const issue = context.issue.number || 1;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue, body
            });

      - name: Fail on compile errors
        if: env.GRADLE_EXIT != '0'
        run: exit 1

      - name: Assemble jar
        if: env.GRADLE_EXIT == '0'
        run: gradle build --no-daemon --console=plain --stacktrace

      - name: Checksums
        if: env.GRADLE_EXIT == '0'
        run: |
          cd build/libs
          sha256sum *.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload jar
        if: env.GRADLE_EXIT == '0'
        uses: actions/upload-artifact@v4
        with:
          name: aetherius-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Attach jar to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            build/libs/SHA256SUMS.txt
          generate_release_notes: true
